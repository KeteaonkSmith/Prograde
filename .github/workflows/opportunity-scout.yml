name: Opportunity Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  scout-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run opportunity scout
        run: node scripts/opportunity-scout.cjs

      - name: Commit and push updates
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No updates to publish."
            exit 0
          fi
          git config user.name "prograde-opportunity-scout"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "chore: refresh opportunity scout"
          git push
